# Calm research-tool look: colour carries meaning, not decoration.
# Accent (gold in dark, teal in light) = act / active · amber = review ·
# red = risk or unsupported · green = verified.
# Both [theme.light] and [theme.dark] are defined, so visitors can switch
# modes from the ⋮ menu → Settings. Dark is the default.

[theme]
base = "dark"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 15
headingFontWeights = [700, 600, 600, 600, 500, 500]
baseRadius = "12px"
buttonRadius = "12px"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

# Dark: near-black graphite with a gold accent.
[theme.dark]
primaryColor = "#C9A227"
backgroundColor = "#0C0D10"
secondaryBackgroundColor = "#16181D"
textColor = "#EDEEF0"
linkColor = "#E3BC3A"
borderColor = "#23262C"
codeBackgroundColor = "#111216"
greenColor = "#7FBF8E"
yellowColor = "#D9A441"
orangeColor = "#D9A441"
redColor = "#E06A5A"
blueColor = "#7FA6C9"
grayColor = "#A6ABB4"

[theme.dark.sidebar]
backgroundColor = "#111216"
secondaryBackgroundColor = "#16181D"
textColor = "#EDEEF0"
borderColor = "#23262C"

[theme.light]
primaryColor = "#0F766E"
backgroundColor = "#F7F8FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"
linkColor = "#0F766E"
borderColor = "#E2E8F0"
codeBackgroundColor = "#FFFFFF"
greenColor = "#15803D"
yellowColor = "#B45309"
orangeColor = "#B45309"
redColor = "#B91C1C"
blueColor = "#0F766E"
grayColor = "#64748B"

[theme.light.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F8FA"
textColor = "#0F172A"
borderColor = "#E2E8F0"
